<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Merhaba, ben Destan Güler. İnternetteki kişisel köşeme hoş geldin.">
  <meta name="theme-color" content="#f5f3ed">
  <title>Destan Güler — Kişisel Web Sitesi</title>
  <style>
    :root { color-scheme: light; --paper: #f5f3ed; --ink: #252b25; --muted: #62685e; --green: #355b43; --line: #d9ddd1; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--green); outline-offset: 6px; }
    .page { max-width: 1160px; min-height: 100svh; margin: auto; padding: 0 48px; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 30px 0; border-bottom: 1px solid var(--line); }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: -.7px; }
    .brand span { color: var(--green); }
    nav a, footer { font-size: 13px; }
    nav a:hover, .text-link:hover { color: var(--green); text-decoration: underline; text-underline-offset: 5px; }
    main { flex: 1; display: grid; grid-template-columns: 1.4fr 1fr; align-items: center; gap: 64px; padding: 90px 0; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 28px; color: var(--green); font-size: 11px; font-weight: 650; letter-spacing: 2px; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    h1 { margin: 0; font-size: clamp(48px, 6vw, 76px); font-weight: 500; line-height: 1.08; letter-spacing: -4px; }
    h1 span { color: var(--green); font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400; }
    .intro { max-width: 390px; margin: 28px 0 32px; color: var(--muted); font-size: 17px; line-height: 1.8; }
    .button { display: inline-flex; align-items: center; gap: 30px; background: var(--green); color: #fff; padding: 15px 20px; border-radius: 5px; font-size: 14px; transition: background .2s; }
    .button:hover { background: #264331; }
    .art { position: relative; aspect-ratio: 4 / 5; max-height: 420px; width: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 180px 180px 8px 8px; background: #e9ecdf; display: grid; place-items: center; }
    .orbit { position: absolute; width: 260px; height: 260px; border: 1px solid #bcc7af; border-radius: 50%; }
    .orbit::before, .orbit::after { content: ""; position: absolute; inset: 24px; border: 1px solid #bcc7af; border-radius: 50%; }
    .orbit::after { inset: -26px; }
    .monogram { position: relative; color: var(--green); font-family: Georgia, "Times New Roman", serif; font-size: 100px; font-style: italic; letter-spacing: -12px; padding-right: 12px; }
    .art-label { position: absolute; bottom: 28px; font-size: 10px; color: var(--green); letter-spacing: 3px; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 24px 0; border-top: 1px solid var(--line); color: var(--muted); line-height: 1.6; }
    footer p { margin: 0; }
    @media (max-width: 700px) {
      .page { padding: 0 24px; }
      header { padding: 24px 0; }
      main { grid-template-columns: 1fr; gap: 44px; padding: 60px 0; }
      h1 { letter-spacing: -2.5px; }
      .art { max-width: 360px; height: 270px; aspect-ratio: auto; justify-self: center; border-radius: 150px 150px 8px 8px; }
      .orbit { width: 180px; height: 180px; }
      .monogram { font-size: 80px; }
      .art-label { bottom: 16px; }
      footer { align-items: flex-start; flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="./" aria-label="Destan Güler ana sayfa">destan güler<span>.</span></a>
      <nav aria-label="Sosyal bağlantılar"><a href="https://github.com/destanguler">GitHub <span aria-hidden="true">↗</span></a></nav>
    </header>
    <main>
      <section aria-labelledby="hello">
        <p class="eyebrow">Kişisel web sitem</p>
        <h1 id="hello">Merhaba,<br>ben <span>Destan Güler.</span></h1>
        <p class="intro">İnternetteki küçük köşeme hoş geldin. Burası zamanla projelerim, notlarım ve yeni fikirlerimle dolacak. Şimdilik bir merhaba.</p>
        <a class="button" href="https://github.com/destanguler">GitHub profilim <span aria-hidden="true">↗</span></a>
      </section>
      <div class="art" aria-hidden="true">
        <div class="orbit"></div>
        <span class="monogram">dg.</span>
        <span class="art-label">HELLO, WORLD.</span>
      </div>
    </main>
    <footer>
      <p>© 2026 Destan Güler</p>
      <p>Küçük bir başlangıç. <span aria-hidden="true">✳</span></p>
    </footer>
  </div>
</body>
</html>
